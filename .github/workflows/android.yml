name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk wavapp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wavapp-apk
          path: wavapp.apk

      # Publica el APK en Releases → "ultimo" para descargarlo directo desde el celular.
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultimo -y --cleanup-tag || true
          gh release create ultimo wavapp.apk --prerelease --target "$GITHUB_SHA" \
            --title "Última compilación ($GITHUB_REF_NAME)" \
            --notes "Commit $GITHUB_SHA. Descarga wavapp.apk e instálalo."
