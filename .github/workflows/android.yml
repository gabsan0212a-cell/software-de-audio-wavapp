name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Si llega otro push a la misma rama, la compilación anterior se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas-nativas:
    name: Pruebas nativas (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Puente JNI completo
        run: python3 tests/check_jni.py
      - name: Pruebas con ASan, UBSan y TSan
        run: |
          # Los sanitizers no soportan la aleatoriedad máxima de memoria de los kernels nuevos.
          sudo sysctl -w vm.mmap_rnd_bits=28
          bash tests/native/run.sh

  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk wavapp.apk
      - id: version
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wavapp-apk
          path: wavapp.apk

  emulador:
    name: Prueba en emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash tests/emulador.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-emulador
          path: |
            app/build/reports/androidTests/
            logcat.txt
            capturas/
      - name: Publicar capturas de pantalla
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          fotos=(capturas/*.png)
          if [ ${#fotos[@]} -eq 0 ]; then echo "Sin capturas"; exit 0; fi
          gh release delete capturas -y --cleanup-tag || true
          gh release create capturas "${fotos[@]}" --prerelease --target "$GITHUB_SHA" \
            --title "Capturas de las pruebas" \
            --notes "Capturas automáticas del emulador (commit $GITHUB_SHA). No es una versión para instalar."

  publicar:
    name: Publicar en Releases
    needs: [pruebas-nativas, apk, emulador]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wavapp-apk
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          NOTAS="Versión $VERSION, commit $GITHUB_SHA. Descarga wavapp.apk desde Chrome e instálalo."
          # "ultimo": siempre la compilación más reciente que pasó todas las pruebas.
          gh release delete ultimo -y --cleanup-tag || true
          gh release create ultimo wavapp.apk --prerelease --target "$GITHUB_SHA" \
            --title "Última compilación (v$VERSION)" --notes "$NOTAS"
          # Una por versión, para poder regresar a una anterior. Si se vuelve a publicar la
          # misma versión, se reemplaza completa (etiqueta incluida) con el commit nuevo.
          gh release delete "v$VERSION" -y --cleanup-tag || true
          gh release create "v$VERSION" wavapp.apk --target "$GITHUB_SHA" \
            --title "WavApp $VERSION" --notes "$NOTAS"
