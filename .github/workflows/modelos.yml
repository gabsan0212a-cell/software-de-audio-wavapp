name: Modelos

# Baja el modelo de voz (Mel-Band RoFormer de Kim, licencia MIT), lo convierte al formato de
# WavApp y genera las referencias con el código original (PyTorch) para probar el motor en C++.
# Todo queda en el release "modelos"; de ahí lo toma la compilación del APK.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/modelos/**'
      - '.github/workflows/modelos.yml'

permissions:
  contents: write

concurrency:
  group: modelos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convertir:
    name: Convertir el modelo de voz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIM_COMMIT: 25f44ffb55ee3c301281bba21b2d6d311cb69ae2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PyTorch (CPU) y lo que usa el código original
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 scipy==1.13.1 librosa==0.10.2.post1 einops==0.6.1 \
            rotary_embedding_torch==0.3.5 beartype==0.14.1 pyyaml==6.0.2
      - name: Código original del modelo (Kim)
        run: |
          git clone https://github.com/KimberleyJensen/Mel-Band-Roformer-Vocal-Model kim
          git -C kim checkout "$KIM_COMMIT"
      - name: Bajar el modelo
        run: |
          curl -L --fail --retry 5 -o MelBandRoformer.ckpt \
            https://huggingface.co/KimberleyJSN/melbandroformer/resolve/main/MelBandRoformer.ckpt
          ls -l MelBandRoformer.ckpt
          sha256sum MelBandRoformer.ckpt | tee ckpt.sha256
      - name: Convertir
        working-directory: tools/modelos
        run: python convertir.py --kim ../../kim --ckpt ../../MelBandRoformer.ckpt --salida ../../salida/voz-kim.wvm
      - name: Referencias (PyTorch)
        working-directory: tools/modelos
        run: python referencias.py --kim ../../kim --ckpt ../../MelBandRoformer.ckpt --salida ../../salida
      - name: Publicar en el release "modelos"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd salida
          sha256sum *.wvm | tee sumas.txt
          sed 's/ .*MelBandRoformer/ MelBandRoformer/' ../ckpt.sha256 >> sumas.txt
          ls -l
          gh release view modelos >/dev/null 2>&1 || gh release create modelos --prerelease --target "$GITHUB_SHA" \
            --title "Modelos (no es para instalar)" \
            --notes "Modelo de voz convertido para WavApp y referencias de prueba. Lo usa la compilación del APK."
          gh release upload modelos ./*.wvm sumas.txt --clobber
